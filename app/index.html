<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>ARCHEA Platform</title>
    <link rel="icon" type="image/svg+xml" href="../icons/archea-favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="../icons/archea-favicon-32.png" />
    <link rel="apple-touch-icon" href="../icons/archea-apple-touch-icon.png" />
    <script>
      // tema prima del primo disegno, per non avere il lampo bianco
      try { var t = localStorage.getItem('archea-theme'); if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.dataset.theme = 'dark'; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
